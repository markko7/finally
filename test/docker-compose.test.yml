# E2E: fresh app container (mock LLM, no volume) + Playwright runner.
# Run from repo root: docker compose -f test/docker-compose.test.yml up --build --exit-code-from playwright
services:
  finally:
    build: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    working_dir: /tests
    volumes:
      - ./:/tests
      - /tests/node_modules
    environment:
      BASE_URL: http://finally:8000
    depends_on:
      finally:
        condition: service_healthy
    command: sh -c "npm ci && npx playwright test"
